name: Check dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux validation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh neovim
          wget -qO /tmp/install-chezmoi.sh https://get.chezmoi.io
          sh /tmp/install-chezmoi.sh -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install macOS validation tools
        if: runner.os == 'macOS'
        run: brew install chezmoi neovim zsh-autosuggestions zsh-syntax-highlighting zsh-completions
      - name: Validate isolated Linux and macOS destinations
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
