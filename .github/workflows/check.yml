name: Check dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux validation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh neovim
          wget -qO /tmp/install-chezmoi.sh https://get.chezmoi.io
          sh /tmp/install-chezmoi.sh -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install macOS validation tools
        if: runner.os == 'macOS'
        run: |
          brew install chezmoi neovim zsh-autosuggestions zsh-syntax-highlighting zsh-completions gh awscli node nvm uv go rustup coreutils findutils gnu-sed gnu-tar grep gawk gnu-getopt make
      - name: Validate macOS package providers
        if: runner.os == 'macOS'
        run: |
          brew bundle list --file=Brewfile
          brew info --json=v2 --formula $(brew bundle list --formula --file=Brewfile) > /tmp/dotfiles-formulae.json
          brew info --json=v2 --cask $(brew bundle list --cask --file=Brewfile) > /tmp/dotfiles-casks.json
          python3 - <<'PY'
          import json
          for filename, key in [('/tmp/dotfiles-formulae.json', 'formulae'), ('/tmp/dotfiles-casks.json', 'casks')]:
              for package in json.load(open(filename))[key]:
                  assert not package['disabled'], package
                  assert not package['deprecated'], package
          PY
      - name: Validate isolated Linux and macOS destinations
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
